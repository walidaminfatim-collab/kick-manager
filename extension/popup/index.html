<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kick Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../assets/icons/icon32.png" alt=""><span>KICK <b>MANAGER</b></span></div>
    <select id="lang" aria-label="Language"><option value="en">EN</option><option value="ar">عربي</option></select>
  </header>
  <main id="app"><div class="center muted" data-i18n="loading">Loading…</div></main>
  <nav id="nav" hidden>
    <button data-view="dashboard"><i>◈</i><span data-i18n="nav_dashboard">Home</span></button>
    <button data-view="accounts"><i>◉</i><span data-i18n="nav_accounts">Accounts</span></button>
    <button data-view="streamers"><i>▶</i><span data-i18n="nav_streamers">Streamers</span></button>
    <button data-view="templates"><i>✎</i><span data-i18n="nav_templates">Templates</span></button>
    <button data-view="settings"><i>⚙</i><span data-i18n="nav_settings">Settings</span></button>
  </nav>
  <div id="toast" role="status"></div>
  <script src="../config.js"></script>
  <script src="../i18n.js"></script>
  <script src="../api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
